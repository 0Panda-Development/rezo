<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    overflow: hidden;
    background: #07070d;
    color: #e8e8f0;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
  }
  #aurora, #particles { position: fixed; inset: 0; pointer-events: none; }
  .blob {
    position: absolute; border-radius: 50%;
    mix-blend-mode: screen;
    opacity: 0.55;
  }
  #blob1 {
    width: 60vmax; height: 60vmax; left: -20vmax; top: -25vmax;
    background: radial-gradient(circle, rgba(124, 92, 255, 0.5), transparent 65%);
    animation: drift1 26s ease-in-out infinite alternate;
  }
  #blob2 {
    width: 55vmax; height: 55vmax; right: -22vmax; top: 5vmax;
    background: radial-gradient(circle, rgba(0, 210, 255, 0.4), transparent 65%);
    animation: drift2 32s ease-in-out infinite alternate;
  }
  #blob3 {
    width: 50vmax; height: 50vmax; left: 15vmax; bottom: -30vmax;
    background: radial-gradient(circle, rgba(255, 45, 146, 0.38), transparent 65%);
    animation: drift3 38s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-16vmax, -10vmax) scale(1.2); } }
  @keyframes drift3 { to { transform: translate(-10vmax, -14vmax) scale(1.1); } }
  .content { position: relative; z-index: 1; padding-top: 60px; }
  h1 {
    font-size: 46px; letter-spacing: 12px;
    background: linear-gradient(90deg, #7c5cff, #00d2ff, #ff2d92, #7c5cff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 6s linear infinite;
    filter: drop-shadow(0 0 20px rgba(124, 92, 255, 0.6));
  }
  @keyframes shimmer { to { background-position: 300% 0; } }
  .tiles { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-top: 48px; }
  a {
    position: relative; display: block; width: 164px; padding: 22px 10px;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0)), #13131d;
    border: 1px solid color-mix(in srgb, var(--accent, #7c5cff) 30%, #26263a);
    border-radius: 14px;
    color: #c8c8d8; text-decoration: none; font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  a[data-host="steam"]   { --accent: #66c0f4; }
  a[data-host="discord"] { --accent: #5865f2; }
  a[data-host="roblox"]  { --accent: #e2231a; }
  a[data-host="reddit"]  { --accent: #ff4500; }
  a[data-host="youtube"] { --accent: #ff0033; }
  a::before {
    content: ""; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.14), transparent);
    transform: skewX(-20deg);
    transition: left 0.5s ease;
  }
  a:hover {
    transform: translateY(-4px) scale(1.04);
    border-color: var(--accent, #7c5cff);
    color: #ffffff;
    box-shadow:
      0 0 22px color-mix(in srgb, var(--accent, #7c5cff) 70%, transparent),
      0 10px 28px rgba(0, 0, 0, 0.5);
  }
  a:hover::before { left: 130%; }
  .status {
    position: relative; z-index: 1;
    display: inline-block; margin-top: 34px; padding: 8px 18px;
    border-radius: 999px; font-size: 13px; font-weight: 600;
    background: rgba(255, 255, 255, 0.04); border: 1px solid #26263a;
    backdrop-filter: blur(4px);
  }
  .status::before {
    content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: currentColor; margin-right: 8px;
    animation: dot 2s ease-in-out infinite;
  }
  @keyframes dot { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  .status.connected    { color: #4ade80; border-color: rgba(74, 222, 128, 0.5);
                         animation: pulse 2.4s ease-in-out infinite; }
  .status.starting     { color: #fbbf24; border-color: rgba(251, 191, 36, 0.5);
                         animation: pulse 1.2s ease-in-out infinite; }
  .status.blocked      { color: #f87171; border-color: rgba(248, 113, 113, 0.5); }
  .status.disconnected { color: #9ca3af; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 6px color-mix(in srgb, currentColor 25%, transparent); }
    50%      { box-shadow: 0 0 18px color-mix(in srgb, currentColor 60%, transparent); }
  }
</style>
</head>
<body>
<div id="aurora">
  <div class="blob" id="blob1"></div>
  <div class="blob" id="blob2"></div>
  <div class="blob" id="blob3"></div>
</div>
<canvas id="particles"></canvas>
<div class="content">
  <h1>REZO</h1>
  <div class="tiles">{{TILES}}</div>
  <p class="status {{STATUSCLASS}}">{{STATUS}}</p>
</div>
<script>
  var cv = document.getElementById('particles');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0;
  function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  var colors = ['124,92,255', '0,210,255', '255,45,146', '255,255,255'];
  var ps = [];
  for (var i = 0; i < 45; i++) {
    ps.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.8 + 0.6,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35 - 0.12,
      c: colors[i % colors.length],
      tw: Math.random() * Math.PI * 2
    });
  }
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      p.tw += 0.05;
      var a = 0.35 + 0.35 * Math.sin(p.tw);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + p.c + ',' + a + ')';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
