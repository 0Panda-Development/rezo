<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    background: #0b0b12;
    color: #e8e8f0;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    padding-top: 60px;
    background-image:
      radial-gradient(60% 50% at 20% 0%, rgba(124, 92, 255, 0.18), transparent 60%),
      radial-gradient(50% 40% at 80% 10%, rgba(0, 210, 255, 0.12), transparent 60%),
      radial-gradient(40% 30% at 50% 100%, rgba(255, 0, 128, 0.08), transparent 60%);
    animation: aurora 14s ease-in-out infinite alternate;
  }
  @keyframes aurora {
    from { background-position: 0% 0%, 100% 0%, 50% 100%; }
    to   { background-position: 8% 6%, 92% 12%, 44% 96%; }
  }
  h1 {
    margin: 0; font-size: 42px; letter-spacing: 10px;
    background: linear-gradient(90deg, #7c5cff, #00d2ff, #ff2d92);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 18px rgba(124, 92, 255, 0.55));
  }
  .tiles { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-top: 44px; }
  a {
    display: block; width: 164px; padding: 22px 10px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0)), #14141f;
    border: 1px solid color-mix(in srgb, var(--accent, #7c5cff) 30%, #26263a);
    border-radius: 12px;
    color: #c8c8d8; text-decoration: none; font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  a[data-host="steam"]   { --accent: #66c0f4; }
  a[data-host="discord"] { --accent: #5865f2; }
  a[data-host="roblox"]  { --accent: #e2231a; }
  a[data-host="reddit"]  { --accent: #ff4500; }
  a[data-host="youtube"] { --accent: #ff0033; }
  a:hover {
    transform: translateY(-3px) scale(1.03);
    border-color: var(--accent, #7c5cff);
    color: #ffffff;
    box-shadow:
      0 0 18px color-mix(in srgb, var(--accent, #7c5cff) 65%, transparent),
      0 8px 24px rgba(0, 0, 0, 0.4);
  }
  .status {
    display: inline-block; margin-top: 34px; padding: 8px 18px;
    border-radius: 999px; font-size: 13px; font-weight: 600;
    background: rgba(255, 255, 255, 0.03); border: 1px solid #26263a;
  }
  .status::before {
    content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: currentColor; margin-right: 8px;
  }
  .status.connected    { color: #4ade80; border-color: rgba(74, 222, 128, 0.5);
                         animation: pulse 2.4s ease-in-out infinite; }
  .status.starting     { color: #fbbf24; border-color: rgba(251, 191, 36, 0.5);
                         animation: pulse 1.2s ease-in-out infinite; }
  .status.blocked      { color: #f87171; border-color: rgba(248, 113, 113, 0.5); }
  .status.disconnected { color: #9ca3af; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 6px color-mix(in srgb, currentColor 25%, transparent); }
    50%      { box-shadow: 0 0 18px color-mix(in srgb, currentColor 60%, transparent); }
  }
</style>
</head>
<body>
<h1>REZO</h1>
<div class="tiles">{{TILES}}</div>
<p class="status {{STATUSCLASS}}">{{STATUS}}</p>
</body>
</html>
